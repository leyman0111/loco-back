name: Deploy loco-back

on:
  push:
    branches: [main]
  # Ручной запуск: Actions → Deploy loco-back → Run workflow
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Тег уже собранного образа (12 символов SHA или latest) — редеплой/откат БЕЗ сборки.
          Пусто — собрать образ из выбранной ветки и задеплоить.
        required: false
        default: ''
        type: string

# не прерываем деплой на середине; следующий запуск встанет в очередь
concurrency:
  group: loco-back-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/leyman0111/loco-back
  APP_DIR: /opt/app

jobs:
  build:
    if: github.event_name == 'push' || inputs.image_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # запускается и когда build пропущен (ручной редеплой по тегу)
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          BUILT_TAG: ${{ needs.build.outputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$BUILT_TAG}"
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Некорректный тег: '$TAG'"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "### Deploy \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4

      - name: Copy compose + initdb to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: deploy/docker-compose.yml,deploy/initdb
          target: ${{ env.APP_DIR }}
          strip_components: 1

      - name: Pull image and restart
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,APP_DIR
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            test -f .env || { echo "Нет $APP_DIR/.env — сначала запусти workflow 'Provision loco-back server'"; exit 1; }
            chmod 755 initdb/*.sh

            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker logout ghcr.io
            # --force-recreate: при ручном редеплое того же тега контейнер всё равно перезапустится
            docker compose up -d --remove-orphans --force-recreate app
            docker compose up -d --remove-orphans
            docker image prune -f >/dev/null

            echo "Waiting for app to become healthy (tag ${IMAGE_TAG})..."
            CID="$(docker compose ps -q app)"
            HEALTHY=0
            for i in $(seq 1 36); do
              STATUS="$(docker inspect -f '{{.State.Health.Status}}' "$CID")"
              echo "[$i] health: $STATUS"
              [ "$STATUS" = "healthy" ] && { HEALTHY=1; break; }
              [ "$STATUS" = "unhealthy" ] && break
              sleep 5
            done
            if [ "$HEALTHY" != 1 ]; then
              echo "App is not healthy, last logs:"
              docker compose logs --tail=200 app
              exit 1
            fi

            # Read-only роль для подключения клиентом (DBeaver). Идемпотентно.
            # Создаётся после старта приложения, т.к. схему и таблицы создаёт Liquibase.
            set -a; . ./.env; set +a
            if [ -n "${DB_READONLY_PASSWORD:-}" ]; then
              docker compose exec -T db psql -v ON_ERROR_STOP=1 -q \
                -U "${DB_USERNAME:-loco}" -d "${DB_NAME:-loco}" \
                -v ro_pw="$DB_READONLY_PASSWORD" \
                -v db="${DB_NAME:-loco}" -v schema="${DB_SCHEMA:-loco}" -v owner="${DB_USERNAME:-loco}" <<'SQL'
            SELECT 'CREATE ROLE loco_ro LOGIN' WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'loco_ro') \gexec
            ALTER ROLE loco_ro WITH LOGIN PASSWORD :'ro_pw' CONNECTION LIMIT 5;
            ALTER ROLE loco_ro SET default_transaction_read_only = on;
            GRANT CONNECT ON DATABASE :"db" TO loco_ro;
            GRANT USAGE ON SCHEMA :"schema" TO loco_ro;
            GRANT SELECT ON ALL TABLES IN SCHEMA :"schema" TO loco_ro;
            GRANT SELECT ON ALL SEQUENCES IN SCHEMA :"schema" TO loco_ro;
            ALTER DEFAULT PRIVILEGES FOR ROLE :"owner" IN SCHEMA :"schema" GRANT SELECT ON TABLES TO loco_ro;
            SQL
              echo "Read-only role loco_ro: OK"
            fi

            docker compose ps
